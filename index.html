<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Rutinas · Alumnos Calistenia</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<!-- Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<!-- Chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ── RESET & BASE ─────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0d0d0d;
  --surface:  #181818;
  --surface2: #222;
  --border:   #2e2e2e;
  --text:     #f0f0f0;
  --muted:    #888;
  --accent:   #3b82f6;
  --green:    #22c55e;
  --orange:   #f97316;
  --red:      #ef4444;

  --estado-activa:    #22c55e;
  --estado-pausada:   #3b82f6;
  --estado-finalizada:#f97316;

  --radius: 14px;
  --font: 'DM Sans', sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

/* ── UTILIDADES ───────────────────────────────── */
.hidden { display: none !important; }

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: none;
  border-radius: 10px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  padding: 12px 16px;
  transition: opacity .15s, transform .1s;
  width: 100%;
}
.btn:active { opacity: .75; transform: scale(.97); }

.btn-primary  { background: var(--accent); color: #fff; }
.btn-success  { background: var(--green);  color: #fff; }
.btn-danger   { background: var(--red);    color: #fff; }
.btn-outline  { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-sm       { padding: 8px 12px; font-size: 13px; width: auto; }

.input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  padding: 12px 14px;
  transition: border-color .2s;
  -webkit-appearance: none;
}
.input:focus { outline: none; border-color: var(--accent); }
.input::placeholder { color: var(--muted); }

/* ── LOGIN ────────────────────────────────────── */
#screen-login {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 32px 24px;
}

.login-logo {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.login-title {
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 32px;
  color: var(--text);
}

.login-form {
  width: 100%;
  max-width: 360px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#login-error {
  font-size: 13px;
  color: var(--red);
  text-align: center;
  min-height: 18px;
}

/* ── APP LAYOUT ───────────────────────────────── */
#screen-app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 16px 12px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}

.app-header-title {
  font-size: 18px;
  font-weight: 700;
}

.app-header-user {
  font-size: 12px;
  color: var(--muted);
  max-width: 130px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Content */
.app-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  flex: 1;
}

/* ── STATS BAR ────────────────────────────────── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.stat-pill {
  background: var(--surface);
  border-radius: 10px;
  padding: 10px 8px;
  text-align: center;
  border: 1px solid var(--border);
}

.stat-pill .stat-num {
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
}

.stat-pill .stat-label {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.stat-pill.green .stat-num { color: var(--estado-activa); }
.stat-pill.blue  .stat-num { color: var(--estado-pausada);   }
.stat-pill.orange .stat-num{ color: var(--estado-finalizada);}

/* ── CHART ────────────────────────────────────── */
.chart-wrap {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px;
  border: 1px solid var(--border);
}

.section-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}

/* ── FORMULARIO ───────────────────────────────── */
.form-card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.form-card.editing {
  border-color: var(--accent);
}

.form-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}

.estado-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.estado-btn {
  padding: 9px 4px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all .15s;
}

.estado-btn[data-estado="Activa"].active     { border-color: var(--estado-activa);     color: var(--estado-activa);     background: #22c55e14; }
.estado-btn[data-estado="Pausada"].active    { border-color: var(--estado-pausada);    color: var(--estado-pausada);    background: #3b82f614; }
.estado-btn[data-estado="Finalizada"].active { border-color: var(--estado-finalizada); color: var(--estado-finalizada); background: #f9731614; }

.form-actions { display: flex; gap: 8px; }
.form-actions .btn { flex: 1; }

/* ── NIVEL ────────────────────────────────────── */
.nivel-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.nivel-btn {
  padding: 9px 4px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all .15s;
}
.nivel-btn.active { border-color: var(--accent); color: var(--accent); background: #3b82f614; }

/* ── DÍAS DE ENTRENO ──────────────────────────── */
.dias-selector {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.dia-btn {
  padding: 9px 2px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: all .15s;
}
.dia-btn.active { border-color: var(--accent); color: var(--accent); background: #3b82f614; }

.textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  padding: 12px 14px;
  resize: vertical;
  min-height: 60px;
  transition: border-color .2s;
}
.textarea:focus { outline: none; border-color: var(--accent); }
.textarea::placeholder { color: var(--muted); }

.field-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 2px;
}

/* ── RUTINA POR DÍA (BLOQUES DINÁMICOS) ───────── */
.dia-rutina-block {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface2);
}

.dia-rutina-header {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
}

.ejercicios-list-day {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.ejercicio-row {
  display: grid;
  grid-template-columns: 1fr 60px 70px 32px;
  gap: 6px;
  align-items: center;
}

.ejercicio-row .input {
  padding: 10px 10px;
  font-size: 13px;
}

.btn-remove-ejercicio {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--red);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.btn-remove-ejercicio:active { opacity: .7; }

.btn-add-ejercicio {
  background: transparent;
  border: 1.5px dashed var(--border);
  color: var(--accent);
}

#dias-rutina-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.dias-rutina-empty {
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  padding: 10px;
}

/* ── FILTROS ──────────────────────────────────── */
.filter-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }

.filter-chip {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.filter-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* ── LISTA ────────────────────────────────────── */
.lista-wrap {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.cliente-card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  animation: fadeUp .25s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.card-nombre { font-size: 16px; font-weight: 700; }

.estado-badge {
  flex-shrink: 0;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
}

.estado-badge.Activa     { background: #22c55e20; color: var(--estado-activa); }
.estado-badge.Pausada    { background: #3b82f620; color: var(--estado-pausada); }
.estado-badge.Finalizada { background: #f9731620; color: var(--estado-finalizada); }

.card-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.card-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
}

.card-row .icon { font-size: 14px; flex-shrink: 0; }

.card-meta {
  font-size: 12px;
  color: var(--muted);
}

.card-extra {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 2px;
}

.nivel-badge {
  flex-shrink: 0;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  background: #3b82f620;
  color: var(--accent);
}

.dia-badge {
  flex-shrink: 0;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
}

.card-objetivo {
  font-size: 13px;
  color: var(--text);
}
.card-objetivo .label { color: var(--muted); }

.card-notas {
  font-size: 12px;
  color: var(--muted);
  font-style: italic;
}

.ejercicios-resumen {
  display: flex;
  flex-direction: column;
  gap: 3px;
  background: var(--surface2);
  border-radius: 8px;
  padding: 8px 10px;
  margin-top: 2px;
}

.ejercicio-item {
  font-size: 13px;
  color: var(--text);
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.ejercicio-item .nombre { flex: 1; }
.ejercicio-item .detalle { color: var(--muted); font-size: 12px; white-space: nowrap; }

.card-actions {
  display: flex;
  gap: 8px;
}

/* ── EXCEL BTN ────────────────────────────────── */
.excel-btn {
  background: #16a34a;
  color: #fff;
}

/* ── EMPTY STATE ──────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-size: 14px;
}

.empty-state .icon { font-size: 36px; margin-bottom: 8px; }

</style>
</head>
<body>

<!-- ══ LOGIN ══════════════════════════════════════ -->
<div id="screen-login">
  <p class="login-logo">Calistenia · Rutinas</p>
  <h1 class="login-title" id="login-title">Ingresá a tu cuenta</h1>

  <div class="login-form">
    <input id="login-email" class="input" type="email" placeholder="Email" autocomplete="email">
    <input id="login-pass"  class="input" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn btn-primary" id="btn-login-action" onclick="Auth.login()">Entrar</button>
    <button class="btn btn-outline" id="btn-toggle-mode" onclick="Auth.toggleMode()">¿No tenés cuenta? Registrate</button>
    <p id="login-error"></p>
  </div>
</div>

<!-- ══ APP ════════════════════════════════════════ -->
<div id="screen-app" class="hidden">

  <!-- Header -->
  <header class="app-header">
    <div>
      <div class="app-header-title">Rutinas Alumnos</div>
      <div class="app-header-user" id="header-user"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline btn-sm" onclick="exportarExcel()">📊 Excel</button>
      <button class="btn btn-outline btn-sm" onclick="Auth.logout()">Salir</button>
    </div>
  </header>

  <div class="app-body">

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-pill green">
        <div class="stat-num" id="stat-activa">0</div>
        <div class="stat-label">Activas</div>
      </div>
      <div class="stat-pill blue">
        <div class="stat-num" id="stat-pausada">0</div>
        <div class="stat-label">Pausadas</div>
      </div>
      <div class="stat-pill orange">
        <div class="stat-num" id="stat-finalizada">0</div>
        <div class="stat-label">Finalizadas</div>
      </div>
    </div>

    <!-- Chart -->
    <div class="chart-wrap">
      <div class="section-label">Resumen</div>
      <canvas id="grafico" height="120"></canvas>
    </div>

    <!-- Formulario -->
    <div class="form-card" id="form-card">
      <div class="form-title" id="form-title">Nueva rutina</div>

      <input id="f-nombre" class="input" placeholder="Nombre del alumno">
      <input id="f-fecha"  class="input" type="date">

      <!-- Estado selector -->
      <div class="estado-selector">
        <button class="estado-btn active" data-estado="Activa"     onclick="UI.setEstado('Activa')">🟢 Activa</button>
        <button class="estado-btn"        data-estado="Pausada"    onclick="UI.setEstado('Pausada')">⏸ Pausada</button>
        <button class="estado-btn"        data-estado="Finalizada" onclick="UI.setEstado('Finalizada')">🏁 Finalizada</button>
      </div>

      <!-- Nivel -->
      <div class="field-label">Nivel</div>
      <div class="nivel-selector" id="nivel-selector">
        <button class="nivel-btn active" data-nivel="Principiante" onclick="UI.setNivel('Principiante')">Principiante</button>
        <button class="nivel-btn"        data-nivel="Intermedio"   onclick="UI.setNivel('Intermedio')">Intermedio</button>
        <button class="nivel-btn"        data-nivel="Avanzado"     onclick="UI.setNivel('Avanzado')">Avanzado</button>
      </div>

      <input id="f-objetivo" class="input" placeholder="Objetivo (ej: Progresar a front lever)">

      <!-- Días de entreno -->
      <div class="field-label">Días de entreno (tocá un día para cargarle ejercicios)</div>
      <div class="dias-selector" id="dias-selector">
        <button class="dia-btn" data-dia="Lun" onclick="UI.toggleDia('Lun', this)">L</button>
        <button class="dia-btn" data-dia="Mar" onclick="UI.toggleDia('Mar', this)">M</button>
        <button class="dia-btn" data-dia="Mié" onclick="UI.toggleDia('Mié', this)">X</button>
        <button class="dia-btn" data-dia="Jue" onclick="UI.toggleDia('Jue', this)">J</button>
        <button class="dia-btn" data-dia="Vie" onclick="UI.toggleDia('Vie', this)">V</button>
        <button class="dia-btn" data-dia="Sáb" onclick="UI.toggleDia('Sáb', this)">S</button>
        <button class="dia-btn" data-dia="Dom" onclick="UI.toggleDia('Dom', this)">D</button>
      </div>

      <textarea id="f-notas" class="textarea" placeholder="Notas (lesiones, observaciones, progresiones a probar...)"></textarea>

      <!-- Rutina por día (bloques dinámicos) -->
      <div class="field-label">Rutina por día</div>
      <div id="dias-rutina-container">
        <div class="dias-rutina-empty" id="dias-rutina-empty">Elegí un día arriba para cargarle ejercicios</div>
      </div>

      <div class="form-actions">
        <button class="btn btn-success" onclick="Rutinas.guardar()">Guardar</button>
        <button class="btn btn-outline hidden" id="btn-cancelar" onclick="UI.cancelarEdicion()">Cancelar</button>
      </div>
    </div>

    <!-- Filtros -->
    <div class="filter-bar">
      <button class="filter-chip active" data-filtro="" onclick="UI.setFiltro(this)">Todos</button>
      <button class="filter-chip" data-filtro="Activa"     onclick="UI.setFiltro(this)">🟢 Activas</button>
      <button class="filter-chip" data-filtro="Pausada"    onclick="UI.setFiltro(this)">⏸ Pausadas</button>
      <button class="filter-chip" data-filtro="Finalizada" onclick="UI.setFiltro(this)">🏁 Finalizadas</button>
    </div>

    <!-- Lista -->
    <div class="section-label" id="lista-count">0 rutinas</div>
    <div class="lista-wrap" id="lista"></div>

  </div><!-- /app-body -->
</div><!-- /screen-app -->

<script>
/* ══════════════════════════════════════════════
   CONFIGURACIÓN
══════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyCAPcfPI7Xem6Ua6uasDws7rfAGn-yUyAs",
  authDomain:        "ticketsrowa.firebaseapp.com",
  projectId:         "ticketsrowa",
  storageBucket:     "ticketsrowa.appspot.com",
  messagingSenderId: "373395832563",
  appId:             "1:373395832563:web:0d8cf5099d4e32296e8186"
};

const ADMIN_EMAIL = "julipatepa@gmail.com";
const COLECCION   = "rutinasAlumnos";
const DIAS_ORDEN  = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];

/* ══════════════════════════════════════════════
   FIREBASE INIT
══════════════════════════════════════════════ */
firebase.initializeApp(FIREBASE_CONFIG);

const db   = firebase.firestore();
const auth = firebase.auth();

/* ══════════════════════════════════════════════
   ESTADO DE LA APP
══════════════════════════════════════════════ */
const State = {
  editId: null,
  estado: "Activa",
  nivel:  "Principiante",
  filtro: "",
  todos:  [],
  chart:  null,
};

/* ══════════════════════════════════════════════
   AUTENTICACIÓN
══════════════════════════════════════════════ */
const Auth = {
  mode: "login",

  toggleMode() {
    this.mode = this.mode === "login" ? "register" : "login";
    const esRegistro = this.mode === "register";

    document.getElementById("login-title").textContent =
      esRegistro ? "Crear cuenta" : "Ingresá a tu cuenta";

    document.getElementById("btn-login-action").textContent =
      esRegistro ? "Crear cuenta" : "Entrar";

    document.getElementById("btn-login-action").onclick =
      esRegistro ? () => Auth.register() : () => Auth.login();

    document.getElementById("btn-toggle-mode").textContent =
      esRegistro ? "¿Ya tenés cuenta? Iniciá sesión" : "¿No tenés cuenta? Registrate";

    document.getElementById("login-error").textContent = "";
  },

  login() {
    const email = document.getElementById("login-email").value.trim();
    const pass  = document.getElementById("login-pass").value;
    if (!email || !pass) {
      document.getElementById("login-error").textContent = "Completá email y contraseña.";
      return;
    }
    auth.signInWithEmailAndPassword(email, pass)
      .catch(() => {
        document.getElementById("login-error").textContent = "Email o contraseña incorrectos.";
      });
  },

  register() {
    const email = document.getElementById("login-email").value.trim();
    const pass  = document.getElementById("login-pass").value;
    if (!email || !pass) {
      document.getElementById("login-error").textContent = "Completá email y contraseña.";
      return;
    }
    if (pass.length < 6) {
      document.getElementById("login-error").textContent = "La contraseña debe tener al menos 6 caracteres.";
      return;
    }
    auth.createUserWithEmailAndPassword(email, pass)
      .then(() => {
        document.getElementById("login-error").textContent = "";
      })
      .catch(e => {
        if (e.code === "auth/email-already-in-use") {
          document.getElementById("login-error").textContent = "Ese email ya está registrado.";
        } else {
          document.getElementById("login-error").textContent = "Error al crear la cuenta.";
        }
      });
  },

  logout() {
    auth.signOut();
  }
};

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById("screen-login").classList.add("hidden");
    document.getElementById("screen-app").classList.remove("hidden");
    document.getElementById("header-user").textContent = user.email;
    UI.limpiarRutinaForm();
    Rutinas.escuchar();
  } else {
    document.getElementById("screen-login").classList.remove("hidden");
    document.getElementById("screen-app").classList.add("hidden");
    document.getElementById("login-error").textContent = "";
    if (Rutinas._unsubscribe) {
      Rutinas._unsubscribe();
      Rutinas._unsubscribe = null;
    }
  }
});

/* ══════════════════════════════════════════════
   RUTINAS (CRUD + LISTENER)
══════════════════════════════════════════════ */
const Rutinas = {
  _unsubscribe: null,

  escuchar() {
    if (this._unsubscribe) this._unsubscribe();
    const email = auth.currentUser.email;

    this._unsubscribe = db.collection(COLECCION)
      .where("usuario", "==", email)
      .orderBy("fechaCarga", "desc")
      .onSnapshot(snapshot => {
        State.todos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        UI.renderLista();
        UI.renderStats();
        UI.renderChart();
      }, err => {
        // Si falta el índice compuesto, Firebase muestra el link en consola
        console.error("Error Firestore:", err.message);
        alert("Error al cargar rutinas: " + err.message + "\n\nRevisá la consola del navegador (F12) — si es falta de índice, ahí aparece un link para crearlo con un clic.");
      });
  },

  guardar() {
    const nombre   = document.getElementById("f-nombre").value.trim();
    const fecha    = document.getElementById("f-fecha").value;
    const objetivo = document.getElementById("f-objetivo").value.trim();
    const notas    = document.getElementById("f-notas").value.trim();
    const rutina   = UI.leerRutinaForm();

    if (!nombre || !fecha) {
      alert("Completá el nombre del alumno y la fecha.");
      return;
    }
    if (rutina.length === 0) {
      alert("Elegí al menos un día y cargale al menos un ejercicio.");
      return;
    }

    const data = {
      nombre,
      fecha,
      objetivo,
      notas,
      rutina,
      estado:     State.estado,
      nivel:      State.nivel,
      usuario:    auth.currentUser.email,
      fechaCarga: firebase.firestore.FieldValue.serverTimestamp(),
    };

    if (State.editId) {
      db.collection(COLECCION).doc(State.editId).update(data)
        .then(() => {
          UI.cancelarEdicion();
        })
        .catch(err => {
          console.error("Error al actualizar rutina:", err);
          alert("No se pudo guardar la rutina: " + err.message);
        });
    } else {
      db.collection(COLECCION).add(data)
        .then(() => {
          UI.limpiarForm();
        })
        .catch(err => {
          console.error("Error al crear rutina:", err);
          alert("No se pudo guardar la rutina: " + err.message);
        });
    }
  },

  editar(id) {
    const c = State.todos.find(x => x.id === id);
    if (!c) return;

    State.editId = id;

    document.getElementById("f-nombre").value   = c.nombre;
    document.getElementById("f-fecha").value    = c.fecha;
    document.getElementById("f-objetivo").value = c.objetivo || "";
    document.getElementById("f-notas").value    = c.notas || "";

    UI.setEstado(c.estado);
    UI.setNivel(c.nivel || "Principiante");
    UI.cargarRutina(c.rutina || []);

    document.getElementById("form-title").textContent = "Editando rutina";
    document.getElementById("form-card").classList.add("editing");
    document.getElementById("btn-cancelar").classList.remove("hidden");

    document.getElementById("form-card").scrollIntoView({ behavior: "smooth" });
  },

  eliminar(id) {
    if (auth.currentUser.email !== ADMIN_EMAIL) {
      alert("Solo el administrador puede eliminar.");
      return;
    }
    if (!confirm("¿Eliminar esta rutina?")) return;
    db.collection(COLECCION).doc(id).delete();
  }
};

/* ══════════════════════════════════════════════
   UI
══════════════════════════════════════════════ */
const UI = {
  setEstado(estado) {
    State.estado = estado;
    document.querySelectorAll(".estado-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.estado === estado);
    });
  },

  setFiltro(chip) {
    State.filtro = chip.dataset.filtro;
    document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    this.renderLista();
  },

  setNivel(nivel) {
    State.nivel = nivel;
    document.querySelectorAll(".nivel-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.nivel === nivel);
    });
  },

  toggleDia(dia, btn) {
    const existente = document.getElementById(`bloque-dia-${dia}`);
    if (existente) {
      existente.remove();
      btn.classList.remove("active");
    } else {
      btn.classList.add("active");
      this.crearBloqueDia(dia);
      this.agregarEjercicioRow(dia);
    }
    this.actualizarEmptyState();
  },

  crearBloqueDia(dia) {
    const cont = document.getElementById("dias-rutina-container");
    const bloque = document.createElement("div");
    bloque.className = "dia-rutina-block";
    bloque.id = `bloque-dia-${dia}`;
    bloque.innerHTML = `
      <div class="dia-rutina-header">${dia}</div>
      <div class="ejercicios-list-day" id="ejercicios-list-${dia}"></div>
      <button type="button" class="btn btn-add-ejercicio btn-sm" onclick="UI.agregarEjercicioRow('${dia}')">➕ Agregar ejercicio</button>
    `;

    // Insertar en el orden correcto de la semana (Lun...Dom)
    const idxNuevo = DIAS_ORDEN.indexOf(dia);
    const siguiente = [...cont.children].find(el =>
      el.classList.contains("dia-rutina-block") &&
      DIAS_ORDEN.indexOf(el.id.replace("bloque-dia-", "")) > idxNuevo
    );
    if (siguiente) {
      cont.insertBefore(bloque, siguiente);
    } else {
      cont.appendChild(bloque);
    }
  },

  actualizarEmptyState() {
    const cont = document.getElementById("dias-rutina-container");
    const hayBloques = cont.querySelector(".dia-rutina-block") !== null;
    const empty = document.getElementById("dias-rutina-empty");
    if (hayBloques && empty) {
      empty.remove();
    } else if (!hayBloques && !document.getElementById("dias-rutina-empty")) {
      const div = document.createElement("div");
      div.className = "dias-rutina-empty";
      div.id = "dias-rutina-empty";
      div.textContent = "Elegí un día arriba para cargarle ejercicios";
      cont.appendChild(div);
    }
  },

  cancelarEdicion() {
    State.editId = null;
    document.getElementById("form-title").textContent = "Nueva rutina";
    document.getElementById("form-card").classList.remove("editing");
    document.getElementById("btn-cancelar").classList.add("hidden");
    this.limpiarForm();
  },

  limpiarForm() {
    document.getElementById("f-nombre").value   = "";
    document.getElementById("f-fecha").value    = "";
    document.getElementById("f-objetivo").value = "";
    document.getElementById("f-notas").value    = "";
    this.setEstado("Activa");
    this.setNivel("Principiante");
    this.limpiarRutinaForm();
  },

  /* ── Rutina por día en el formulario ── */
  agregarEjercicioRow(dia, datos) {
    const cont = document.getElementById(`ejercicios-list-${dia}`);
    if (!cont) return;
    const row = document.createElement("div");
    row.className = "ejercicio-row";
    row.innerHTML = `
      <input class="input ejercicio-nombre" placeholder="Ejercicio (ej: Flexiones)">
      <input class="input ejercicio-series" placeholder="Series">
      <input class="input ejercicio-reps" placeholder="Reps">
      <button type="button" class="btn-remove-ejercicio" onclick="UI.eliminarEjercicioRow(this)">✕</button>
    `;
    cont.appendChild(row);

    if (datos) {
      row.querySelector(".ejercicio-nombre").value = datos.nombre || "";
      row.querySelector(".ejercicio-series").value = datos.series || "";
      row.querySelector(".ejercicio-reps").value   = datos.reps || "";
    }
  },

  eliminarEjercicioRow(btn) {
    btn.closest(".ejercicio-row").remove();
  },

  limpiarRutinaForm() {
    document.querySelectorAll(".dia-btn").forEach(btn => btn.classList.remove("active"));
    document.getElementById("dias-rutina-container").innerHTML = "";
    this.actualizarEmptyState();
  },

  cargarRutina(rutina) {
    this.limpiarRutinaForm();
    (rutina || []).forEach(entrada => {
      const btn = document.querySelector(`.dia-btn[data-dia="${entrada.dia}"]`);
      if (btn) btn.classList.add("active");
      this.crearBloqueDia(entrada.dia);
      (entrada.ejercicios || []).forEach(ej => this.agregarEjercicioRow(entrada.dia, ej));
    });
    this.actualizarEmptyState();
  },

  leerRutinaForm() {
    const rutina = [];
    DIAS_ORDEN.forEach(dia => {
      const cont = document.getElementById(`ejercicios-list-${dia}`);
      if (!cont) return;
      const ejercicios = [];
      cont.querySelectorAll(".ejercicio-row").forEach(row => {
        const nombre = row.querySelector(".ejercicio-nombre").value.trim();
        const series = row.querySelector(".ejercicio-series").value.trim();
        const reps   = row.querySelector(".ejercicio-reps").value.trim();
        if (nombre) ejercicios.push({ nombre, series, reps });
      });
      if (ejercicios.length) rutina.push({ dia, ejercicios });
    });
    return rutina;
  },

  renderLista() {
    const lista = document.getElementById("lista");
    const filtrados = State.filtro
      ? State.todos.filter(c => c.estado === State.filtro)
      : State.todos;

    document.getElementById("lista-count").textContent =
      `${filtrados.length} rutina${filtrados.length !== 1 ? "s" : ""}`;

    if (filtrados.length === 0) {
      lista.innerHTML = `
        <div class="empty-state">
          <div class="icon">🏋️</div>
          No hay rutinas en esta categoría.
        </div>`;
      return;
    }

    lista.innerHTML = filtrados.map(c => `
      <div class="cliente-card">
        <div class="card-top">
          <div class="card-nombre">${c.nombre}</div>
          <span class="estado-badge ${c.estado}">${c.estado}</span>
        </div>

        <div class="card-info">
          <div class="card-row">
            <span class="icon">📅</span>
            ${c.fecha}
          </div>
          <div class="card-extra">
            ${c.nivel ? `<span class="nivel-badge">${c.nivel}</span>` : ""}
            ${(c.rutina || []).map(r => `<span class="dia-badge">${r.dia}</span>`).join("")}
          </div>
          ${c.objetivo ? `<div class="card-objetivo"><span class="label">🎯 </span>${c.objetivo}</div>` : ""}
          ${c.notas ? `<div class="card-notas">📝 ${c.notas}</div>` : ""}
          ${(c.rutina || []).map(r => `
            <div class="ejercicios-resumen">
              <div class="ejercicio-item"><span class="nombre" style="font-weight:700">${r.dia}</span></div>
              ${(r.ejercicios || []).map(e => `
                <div class="ejercicio-item">
                  <span class="nombre">${e.nombre}</span>
                  <span class="detalle">${e.series ? e.series + "x" : ""}${e.reps || ""}</span>
                </div>
              `).join("")}
            </div>
          `).join("")}
        </div>

        <div class="card-actions">
          <button class="btn btn-outline btn-sm" onclick="Rutinas.editar('${c.id}')">✏️ Editar</button>
          <button class="btn btn-danger btn-sm"  onclick="Rutinas.eliminar('${c.id}')">🗑 Eliminar</button>
        </div>
      </div>
    `).join("");
  },

  renderStats() {
    const counts = { Activa: 0, Pausada: 0, Finalizada: 0 };
    State.todos.forEach(c => { if (counts[c.estado] !== undefined) counts[c.estado]++; });
    document.getElementById("stat-activa").textContent     = counts.Activa;
    document.getElementById("stat-pausada").textContent    = counts.Pausada;
    document.getElementById("stat-finalizada").textContent = counts.Finalizada;
  },

  renderChart() {
    const counts = { Activa: 0, Pausada: 0, Finalizada: 0 };
    State.todos.forEach(c => { if (counts[c.estado] !== undefined) counts[c.estado]++; });

    const ctx = document.getElementById("grafico").getContext("2d");

    if (State.chart) State.chart.destroy();

    State.chart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: ["Activas", "Pausadas", "Finalizadas"],
        datasets: [{
          data: [counts.Activa, counts.Pausada, counts.Finalizada],
          backgroundColor: ["#22c55e40", "#3b82f640", "#f9731640"],
          borderColor:     ["#22c55e",   "#3b82f6",   "#f97316"],
          borderWidth: 2,
          borderRadius: 8,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: "#2e2e2e" }, ticks: { color: "#888" } },
          y: { grid: { color: "#2e2e2e" }, ticks: { color: "#888", stepSize: 1 }, beginAtZero: true }
        }
      }
    });
  }
};

/* ══════════════════════════════════════════════
   EXPORT EXCEL
══════════════════════════════════════════════ */
function exportarExcel() {
  if (!State.todos.length) { alert("No hay rutinas para exportar."); return; }

  const filas = [];
  State.todos.forEach(c => {
    (c.rutina || []).forEach(r => {
      (r.ejercicios || []).forEach(e => {
        filas.push({
          Alumno:      c.nombre,
          Fecha:       c.fecha,
          Estado:      c.estado,
          Nivel:       c.nivel || "",
          Objetivo:    c.objetivo || "",
          Día:         r.dia,
          Ejercicio:   e.nombre,
          Series:      e.series,
          Reps:        e.reps,
          Notas:       c.notas || "",
          Usuario:     c.usuario,
        });
      });
    });
  });

  const ws = XLSX.utils.json_to_sheet(filas);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Rutinas");
  XLSX.writeFile(wb, "rutinas-alumnos.xlsx");
}
